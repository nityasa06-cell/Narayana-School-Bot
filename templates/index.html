<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narayana School Assistant</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Chat container ───────────────────────────────────── */
    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────── */
    .chat-header {
      background: #1a1a2e;
      color: #ffffff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #4f8ef7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .chat-header .info h1 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .chat-header .info p {
      font-size: 0.78rem;
      color: #a0aec0;
      margin-top: 2px;
    }

    /* ── Messages area ────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Bot message */
    .message.bot {
      background: #f0f4f8;
      color: #1a1a2e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* User message */
    .message.user {
      background: #1a1a2e;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* Error message */
    .message.error {
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #fed7d7;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* ── Typing indicator ─────────────────────────────────── */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
      background: #f0f4f8;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      align-items: center;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #718096;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    /* ── Input area ───────────────────────────────────────── */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #ffffff;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.92rem;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #4f8ef7; }

    #send-btn {
      width: 44px;
      height: 44px;
      background: #1a1a2e;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    #send-btn:hover:not(:disabled)  { background: #2d2d4e; }
    #send-btn:active:not(:disabled) { transform: scale(0.95); }
    #send-btn:disabled { background: #a0aec0; cursor: not-allowed; }

    /* ── Scrollbar ────────────────────────────────────────── */
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">🎓</div>
    <div class="info">
      <h1>Narayana School Assistant</h1>
      <p>Narayana School, Kalimpong</p>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="message bot">
      Hi! I'm the Narayana School Assistant. Ask me anything about Narayana School, Kalimpong — academics, campus, activities, schedules, and more. 😊
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea
      id="user-input"
      rows="1"
      placeholder="Type your message..."
    ></textarea>
    <button id="send-btn" title="Send">
      &#10148;
    </button>
  </div>

</div>

<script>
  // ── State ────────────────────────────────────────────────
  // We store the conversation history locally so the backend
  // can maintain context across messages without a database.
  const history = [];

  // ── DOM refs ─────────────────────────────────────────────
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");

  // ── Helpers ──────────────────────────────────────────────
  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.classList.add("message", role);  // role: "user" | "bot" | "error"
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function showTyping() {
    const indicator = document.createElement("div");
    indicator.classList.add("typing-indicator");
    indicator.id = "typing";
    indicator.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(indicator);
    scrollToBottom();
  }

  function hideTyping() {
    const indicator = document.getElementById("typing");
    if (indicator) indicator.remove();
  }

  function setLoading(loading) {
    sendBtn.disabled = loading;
    inputEl.disabled = loading;
  }

  // Auto-grow textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });

  // ── Send message ─────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    // Show user message
    addMessage(text, "user");
    inputEl.value = "";
    inputEl.style.height = "auto";

    // Show loading state
    setLoading(true);
    showTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history })
      });

      const data = await response.json();
      hideTyping();

      if (!response.ok || data.error) {
        addMessage("Sorry, something went wrong: " + (data.error || "Unknown error."), "error");
      } else {
        const reply = data.reply;
        addMessage(reply, "bot");

        // Update history so context is preserved in next turn
        history.push({ role: "user",  parts: text });
        history.push({ role: "model", parts: reply });
      }
    } catch (err) {
      hideTyping();
      addMessage("Network error. Please check your connection.", "error");
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  // ── Event listeners ──────────────────────────────────────
  sendBtn.addEventListener("click", sendMessage);

  // Send on Enter (Shift+Enter = newline)
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
